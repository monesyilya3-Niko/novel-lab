appId: com.xuan.desktop
productName: xuan
directories:
  output: release
  buildResources: build
files:
  - main.js
  - package.json
extraResources:
  - from: backend
    to: backend
    filter:
      - "**/*"
win:
  target:
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  artifactName: xuan-Setup-${version}-win64.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: xuan
  uninstallDisplayName: xuan
  # 未签名：Windows SmartScreen 会提示，属预期行为（个人分发无证书）。
  # 注：Linux 下打 NSIS 安装器需 wine，本机构建改用 zip 便携版；要 NSIS 请在 Windows 上跑 npm run dist。
