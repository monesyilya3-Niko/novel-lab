name: 构建 Windows 安装包

# 用途：Linux 构建机因缺 wine 打不出 NSIS 安装器（electron-builder 硬性要求），
# 真正的 .exe 安装器只能在 Windows 上构建。本 workflow 在云端 Windows runner
# 上跑 `npm run dist`，产物为 NSIS 安装器。
#
# 触发：推送到 feat/enterprise-hardening 分支即自动构建；
# 也可在 Actions 页面手动 Run workflow（需 workflow 已合入默认分支）。

on:
  # 手动触发（workflow 合并进默认分支后可用）
  workflow_dispatch:
  # 推送到本分支即自动构建安装器
  push:
    branches: [feat/enterprise-hardening]

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
        # 注：启用 npm 缓存的前提是 desktop/package-lock.json 已入库（旧写法里它被
        # .gitignore 忽略，runner 上没有 lock，开缓存会 "unable to cache dependencies" 硬失败）。

      - name: 安装依赖
        # 用 npm ci 而不是 npm install：依赖版本由仓库里的 lockfile 决定，
        # 不再随每次 runner 解析漂移（旧写法每次可能装到不同的 Electron / electron-builder）。
        run: npm ci

      - name: 构建 NSIS 安装器
        # predist 钩子自动执行：fetch-python-win.py（准备 embeddable Python，
        # runner 上 python 命令可用）+ sync_backend.py（把后端与随包资源同步进
        # desktop/backend/，含 python-win/；缺失则 fail fast，不产残缺包）。
        # 文件数不写在这里：资产与报告增删（甚至新增一个 gui/*.py）都会让任何
        # 手抄的数字立刻过期，sync_backend.py 运行时会自己打印实际数量。
        run: npm run dist

      - name: 上传安装器
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: desktop/release/*-Setup-*-win64.exe
          if-no-files-found: error
