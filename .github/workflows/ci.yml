name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff coverage
      - name: Lint (ruff)
        run: ruff check .
      - name: Iron rule 3 guard (stdlib-only) + full test suite
        run: |
          coverage run --parallel-mode run_tests.py
          coverage combine
          coverage report
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: ignore

  web:
    name: Web (build + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test -- --run
      - name: Type check + build
        run: npm run build
      - name: Dist freshness check
        run: |
          # dist 预构建产物按设计入库（用户免装 Node）；校验它与 src 同步。
          npm run build
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist 与 src 不同步——请本地 npm run build 后提交最新 dist"
            git status --porcelain dist
            exit 1
          fi
