name: CI

on:
  push:
    # feat/** 必须纳入：v2.0.x 全部产品线与发版都发生在这条分支上，而它此前
    # 根本不触发 CI（只有 master/main 与 PR），等于交付线没有任何 lint/测试门禁。
    # 2026-10-08 实测：master 上 ruff 报 22 处（B904/I001/F401/B007），而工作分支
    # 早已清零——CI 一直在检一条陈旧的法线。
    branches: [master, main, "feat/**"]
  pull_request:

# lint 工具链锁版本：`pip install ruff` 不钉版本时，同一个提交会因为 ruff
# 自己发了补丁版而从绿变红（2026-10-08 实测：CI 抓到 0.16.10、本机 0.16.8，
# 诊断数量随之漂移）。门禁的判定标准必须和代码一起进版本库。
env:
  RUFF_VERSION: "0.16.10"
  COVERAGE_VERSION: "7.16.2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==${{ env.RUFF_VERSION }}" "coverage==${{ env.COVERAGE_VERSION }}"
      - name: Lint (ruff)
        run: ruff check .
      - name: Iron rule 3 guard (stdlib-only) + full test suite
        run: |
          coverage run --parallel-mode run_tests.py
          coverage combine
          coverage report --fail-under=60
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: ignore

  # 跨平台 / 多版本矩阵（2026-09-23 总工新增，同日升级为门禁）。
  #
  # 为什么需要：原矩阵只有 windows-latest + Python 3.13 单点，而项目对外承诺
  # 「纯标准库、跨平台」（gui/server.py 的 _pid_is_alive 有 POSIX 回退、
  # secret_store 非 Windows 降级 0600 明文、DPAPI 用例有 skipUnless(win32) 守卫）。
  # 承诺必须有对应的持续验证，否则只是文案。
  #
  # 升级记录：首次加入时设 continue-on-error: true（本机只有 Windows + 3.13，
  # 新腿红绿无法本地预判，盲改会让主干立刻变红）。首轮 CI（run 35884685050）
  # 三个 ubuntu 腿**全部通过**，实测日志确认 `Ran 909 tests`（与 Windows 同规模）
  # 且 `ruff check .` 全绿——跨平台兼容性已获证据，故去掉 continue-on-error
  # 升级为门禁。若日后出现偶发失败，应排查根因而不是改回非阻断。
  python-cross-platform:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==${{ env.RUFF_VERSION }}"
      - name: Lint (ruff)
        run: ruff check .
      - name: Full test suite
        run: python run_tests.py

  web:
    name: Web (build + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test -- --run
      - name: Type check + build
        run: npm run build
      - name: E2E smoke (Playwright)
        working-directory: gui/web
        run: |
          # 必须用仓库锁定的 playwright 装浏览器：在仓库根跑 `npx playwright install`
          # 会因根目录没有 playwright 包而从 registry 抓最新版（2026-10-08 实测装了
          # playwright@1.64.0 / chromium v1248），而测试用的是 gui/web 里锁定的
          # @playwright/test@1.63.0（要 v1243），于是所有用例在 launch 时
          # "Executable doesn't exist" 全灭。
          npx playwright install chromium
      - name: 跑 E2E smoke（隔离副本 + 独立端口）
        working-directory: .
        run: |
          # 隔离运行：rsync 工作树副本 → 独立端口 → 跑 Playwright → 删副本。
          # 禁止在 checkout 上直接起服务（会污染 gui_state/、corpus/、assets/）。
          bash scripts/e2e_isolated.sh
      - name: E2E onboarding（空库，独立隔离运行）
        working-directory: .
        run: |
          # 第二次独立隔离调用：空库模式（排除 corpus/assets/reports/gui-state），
          # 验证首访 OnboardingWizard 三步走/跳过。与上面 smoke 隔离，互不干扰。
          E2E_EMPTY_LIBRARY=1 bash scripts/e2e_isolated.sh e2e/onboarding.spec.ts
      - name: Dist freshness check
        run: |
          # dist 预构建产物按设计入库（用户免装 Node）。
          # 1. 验证产物文件完整性（必须存在主入口 HTML 与 assets 目录）
          test -s dist/index.html || { echo "::error::dist/index.html 缺失或为空"; exit 1; }
          test -d dist/assets || { echo "::error::dist/assets 目录缺失"; exit 1; }
          JS_COUNT=$(ls dist/assets/*.js 2>/dev/null | wc -l)
          if [ "$JS_COUNT" -lt 5 ]; then
            echo "::error::dist/assets 中的 bundle 产物不完整 (数量: $JS_COUNT)"
            exit 1
          fi
          # 2. 若本次提交改动了 src/，校验 dist/ 也必须有对应更新（防止本地修改源码后漏跑 build 提交）
          #    由于 Windows 与 Linux (Ubuntu runner) 下 Vite/Rollup 会因路径分隔符产生微小 chunk 哈希差异，
          #    校验规则为：如果 src/ 发生变更，dist/ 也必须包含提交记录。
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            SRC_CHANGED=$(git diff --name-only HEAD~1 HEAD -- src || true)
            DIST_CHANGED=$(git diff --name-only HEAD~1 HEAD -- dist || true)
            if [ -n "$SRC_CHANGED" ] && [ -z "$DIST_CHANGED" ]; then
              echo "::error::检测到 src/ 有改动但 dist/ 未同步更新，请本地运行 npm run build 后提交最新 dist"
              exit 1
            fi
          fi

