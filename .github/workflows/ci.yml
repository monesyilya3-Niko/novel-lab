name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff coverage
      - name: Lint (ruff)
        run: ruff check .
      - name: Iron rule 3 guard (stdlib-only) + full test suite
        run: |
          coverage run --parallel-mode run_tests.py
          coverage combine
          coverage report
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: ignore

  # 跨平台 / 多版本矩阵（2026-09-23 总工新增，同日升级为门禁）。
  #
  # 为什么需要：原矩阵只有 windows-latest + Python 3.13 单点，而项目对外承诺
  # 「纯标准库、跨平台」（gui/server.py 的 _pid_is_alive 有 POSIX 回退、
  # secret_store 非 Windows 降级 0600 明文、DPAPI 用例有 skipUnless(win32) 守卫）。
  # 承诺必须有对应的持续验证，否则只是文案。
  #
  # 升级记录：首次加入时设 continue-on-error: true（本机只有 Windows + 3.13，
  # 新腿红绿无法本地预判，盲改会让主干立刻变红）。首轮 CI（run 35884685050）
  # 三个 ubuntu 腿**全部通过**，实测日志确认 `Ran 909 tests`（与 Windows 同规模）
  # 且 `ruff check .` 全绿——跨平台兼容性已获证据，故去掉 continue-on-error
  # 升级为门禁。若日后出现偶发失败，应排查根因而不是改回非阻断。
  python-cross-platform:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Full test suite
        run: python run_tests.py

  web:
    name: Web (build + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test -- --run
      - name: Type check + build
        run: npm run build
      - name: E2E smoke (Playwright)
        working-directory: .
        run: |
          # 起本地服务（纯标准库后端，ubuntu 可直接跑），等就绪后跑 e2e
          python3 -m gui.server --port 8000 --no-browser &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/ >/dev/null && break
            sleep 1
          done
          cd gui/web
          npx playwright install chromium
          npx playwright test
      - name: Dist freshness check
        run: |
          # dist 预构建产物按设计入库（用户免装 Node）；校验它与 src 同步。
          npm run build
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist 与 src 不同步——请本地 npm run build 后提交最新 dist"
            git status --porcelain dist
            exit 1
          fi
