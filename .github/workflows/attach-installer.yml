name: attach-installer

# 手动触发：把某次 Windows 构建 run 的安装包产物挂到指定 Release 上。
# 解决浏览器/API 都无法上传 Release 附件的问题（GITHUB_TOKEN 在 CI 内可以）。
# 用法：Actions 页 → attach-installer → Run workflow → 填 build_run_id 与 tag。
#
# 注意：不要用 `gh release upload` 传中文文件名——GitHub 会把 CJK 字符从
# multipart 文件名里剥掉（实测 "暮冬念春-Setup-2.0.2-win64.exe" 变成
# "-Setup-2.0.1-win64.exe"）。连 uploads API 的 ?name= 参数（已做
# percent-encoding）也会被服务端剥掉 CJK 字符。结论：GitHub Release 资产名
# 只支持 ASCII，这里统一用拼音命名。

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Windows 构建产物所在的 Actions run id'
        required: true
      tag:
        description: '目标 Release tag'
        required: true
        default: 'v2.0.2'

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release (API, explicit ASCII name)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILE="暮冬念春-Setup-2.0.2-win64.exe"
          ASSET_NAME="mudong-nianchun-Setup-2.0.2-win64.exe"
          ls -la "$FILE"
          sha256sum "$FILE"
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases/tags/${{ inputs.tag }}" --jq .id)
          NAME=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$ASSET_NAME")
          echo "uploading $FILE as asset: $ASSET_NAME to release $RELEASE_ID"
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${FILE}" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${NAME}" \
            | tee upload_result.json
          python3 - <<'EOF'
          import json
          d = json.load(open("upload_result.json"))
          assert d.get("name") == "mudong-nianchun-Setup-2.0.2-win64.exe", f"name unexpected: {d.get('name')}"
          assert d.get("size") == 93327513, f"size mismatch: {d.get('size')}"
          assert d.get("digest") == "sha256:8babe6e78fde661245179b3beab97d77b5a832a33dd3cb99dd09ca89e4e83c35", "digest mismatch"
          print("OK:", d["name"], d["size"], "bytes", d["digest"])
          print("download:", d["browser_download_url"])
          EOF
